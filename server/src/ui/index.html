<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Jen Server</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<header>
		<div class="brand">
			<img class="brand-icon" src="/icon.svg" alt="" width="36" height="36">
			<h1><span class="word">JEN</span><span class="sub">server</span></h1>
		</div>

		<div id="whoami" class="whoami hidden">
			<div class="menu">
				<button id="user-btn" class="icon-btn" aria-haspopup="true" aria-expanded="false"
					aria-controls="user-menu" title="Signed-in key">
					<!-- Inline so the navbar needs no second request, and inherits currentColor. -->
					<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
						<circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
						<path d="M4.8 20c0-3.6 3.2-5.8 7.2-5.8s7.2 2.2 7.2 5.8" fill="none"
							stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
					</svg>
				</button>

				<div id="user-menu" class="menu-panel hidden" role="menu">
					<p class="menu-label">Signed in as</p>
					<p id="menu-id" class="mono menu-value"></p>
					<p class="menu-label">Scopes</p>
					<p id="menu-scopes" class="mono menu-value scopes"></p>
					<button id="logout" class="ghost menu-action">Sign out</button>
				</div>
			</div>
		</div>
	</header>

	<main>
		<!-- Login -->
		<section id="login" class="card">
			<h2>Sign in</h2>
			<p class="muted">Use an API key. The <code>id</code> is optional; the secret is required.</p>
			<label>Key id <input id="login-id" type="text" autocomplete="username" placeholder="(optional)"></label>
			<label>Secret <input id="login-secret" type="password" autocomplete="current-password" placeholder="key secret"></label>
			<button id="login-btn">Sign in</button>
			<p id="login-error" class="error"></p>
		</section>

		<!-- Matches -->
		<section id="matches" class="card hidden">
			<div class="card-head">
				<h2>Matches</h2>
				<button class="ghost" data-refresh="matches">Refresh</button>
			</div>
			<p id="matches-scope" class="muted"></p>
			<div class="table-wrap">
				<table>
					<thead><tr><th>Code</th><th>Owner</th><th>Seats</th><th>Status</th><th>Updated</th><th></th></tr></thead>
					<tbody id="matches-body"></tbody>
				</table>
			</div>
			<p id="matches-empty" class="muted hidden">No matches.</p>
		</section>

		<!-- Clients (admin only) -->
		<section id="clients" class="card hidden">
			<div class="card-head">
				<h2>Client keys</h2>
				<button class="ghost" data-refresh="clients">Refresh</button>
			</div>

			<form id="create-key" class="create-key">
				<label>New key id <input id="key-id" type="text" placeholder="e.g. alice"></label>
				<fieldset>
					<legend>Scopes</legend>
					<label class="inline"><input type="checkbox" value="host_match" checked> <span class="mono">host_match</span></label>
					<label class="inline"><input type="checkbox" value="join_match" checked> <span class="mono">join_match</span></label>
					<label class="inline"><input type="checkbox" value="admin"> <span class="mono">admin</span></label>
				</fieldset>
				<button type="submit">Create key</button>
			</form>
			<div id="new-secret" class="new-secret hidden">
				<strong>Copy this secret now — it is shown only once:</strong>
				<code id="new-secret-value"></code>
			</div>

			<div class="table-wrap">
				<table>
					<thead><tr><th>Id</th><th>Scopes</th><th>Created</th><th></th></tr></thead>
					<tbody id="clients-body"></tbody>
				</table>
			</div>
		</section>
	</main>

	<footer>
		<span id="version" class="mono muted"></span>
	</footer>

	<script src="/app.js"></script>
</body>
</html>
